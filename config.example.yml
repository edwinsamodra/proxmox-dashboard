# PMO config — all values can be overridden by environment variables

server:
  host: "0.0.0.0"
  port: 8080

proxmox:
  host: "192.168.1.100"  # override with PMO_PROXMOX_HOST
  port: 8006
  insecure: true          # allow self-signed TLS certs

auth:
  secret: "change-me-in-production"  # override with PMO_SECRET

opentofu:
  workspace_dir: "/tmp/pmo-workspaces"  # override with PMO_TOFU_DIR
  binary_path: "tofu"                   # override with PMO_TOFU_BIN
