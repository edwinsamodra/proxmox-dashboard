version: "3.9"

services:
  pmo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Proxmox connection
      PMO_PROXMOX_HOST: ${PROXMOX_HOST:-192.168.1.99}
      PMO_PROXMOX_PORT: ${PROXMOX_PORT:-8006}

      # Auth — choose one:
      # Option A: Username + password
      PROXMOX_USER: ${PROXMOX_USER:-root}
      PROXMOX_PASSWORD: ${PROXMOX_PASSWORD:-jamurkembang}
      PROXMOX_REALM: ${PROXMOX_REALM:-pam}

      # Option B: API token (takes priority over user/password)
      # PROXMOX_TOKEN_ID: user@pam!mytoken
      # PROXMOX_TOKEN_SECRET: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

      # Server
      PMO_PORT: 8080
      PMO_SECRET: ${PMO_SECRET:-change-me-in-production}
      PMO_TOFU_DIR: /app/workspaces

      # OpenTofu binary (mount or install in a custom image)
      # PMO_TOFU_BIN: /usr/local/bin/tofu

    volumes:
      - pmo-workspaces:/app/workspaces
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pmo-workspaces:
    driver: local
